<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3>Edit Student</h3>

            <form method="POST">
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ student[1] }}" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Subject</label>
                    <select name="subject" class="form-select" required>
    <option value="Mathematics" {% if student[2]=='Mathematics' %}selected{% endif %}>Mathematics</option>
    <option value="Physics" {% if student[2]=='Physics' %}selected{% endif %}>Physics</option>
    <option value="Chemistry" {% if student[2]=='Chemistry' %}selected{% endif %}>Chemistry</option>
    <option value="English" {% if student[2]=='English' %}selected{% endif %}>English</option>
    <option value="Computer Science" {% if student[2]=='Computer Science' %}selected{% endif %}>Computer Science</option>
    <option value="Biology" {% if student[2]=='Biology' %}selected{% endif %}>Biology</option>
</select>

                </div>

                <div class="mb-3">
                    <label>Marks</label>
                    <input type="number" name="marks" value="{{ student[3] }}" class="form-control">
                </div>

                <button class="btn btn-success">Update</button>
                <a href="/" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
