<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3>Edit Student</h3>

            <form method="POST">
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ student[1] }}" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Subject</label>
                    <input type="text" name="subject" value="{{ student[2] }}" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Marks</label>
                    <input type="number" name="marks" value="{{ student[3] }}" class="form-control">
                </div>

                <button class="btn btn-success">Update</button>
                <a href="/" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
