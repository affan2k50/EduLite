<!DOCTYPE html>
<html>
<head>
    <title>Required Marks Calculator</title>
   
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3>Required Marks to Pass</h3>

            <form method="POST">
                <input type="number" name="current" placeholder="Enter current marks" class="form-control mb-3">
                <button class="btn btn-primary">Calculate</button>
            </form>
            {% if error %}
<div class="alert alert-danger mt-3">
    {{ error }}
</div>
{% endif %}


            {% if result %}
<h5 class="mt-3 text-success">
    You need {{ result }} more marks to pass.
</h5>
{% endif %}

        </div>
    </div>
</div>
<div class="text-center mt-4">
    <a href="/" class="btn btn-primary px-4">

        Back to Dashboard
    </a>
</div>



</body>
</html>
